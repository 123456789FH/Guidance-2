een;gap:15px;align-items:center;flex-wrap:wrap}.nav-buttons,.other-buttons{display:flex;gap:10px;flex-wrap:wrap}.flagbtn{font-size:14px}.flagbtn.active{background:#faf0dc;border-color:#d8b36b;color:#876322}.sidebar{padding:22px;position:sticky;top:13px}.sidebar h3{font-size:16px;margin:0 0 6px;color:#224a40}.small-muted{font-size:12px;color:var(--muted);margin:0 0 18px}.question-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.qdot{padding:0;height:40px;min-width:0;background:#f7faf6;border:1px solid #d9e4dd;border-radius:10px;font-weight:700;color:#53675f}.qdot.done{background:#e0f1e7;color:#18634f;border-color:#a8d8c0}.qdot.active{outline:2px solid #be9858;outline-offset:1px}.qdot.flagged:after{content:"★";font-size:8px;color:#be8b39;position:relative;top:-11px;right:0}.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:17px 0}.key{display:inline-block;width:11px;height:11px;border-radius:4px;background:#e0f1e7;border:1px solid #b2dac2;margin-left:4px}.key.empty{background:#f7faf6;border-color:#d9e4dd}.key.flag{background:#f9e8c0;border-color:#e3c483}.side-foot{border-top:1px solid #e4e9e2;padding-top:14px;margin-top:16px;color:var(--muted);font-size:13px}.side-foot b{color:#1c5547}.results{padding:32px 34px;max-width:1000px;margin:0 auto}.result-hero{display:flex;align-items:center;gap:24px;flex-wrap:wrap}.medallion{width:148px;height:148px;border:8px solid #ddece2;box-shadow:inset 0 0 0 4px #b5cfbf;border-radius:50%;display:grid;align-content:center;justify-content:center;text-align:center;background:#f7fcf8;color:#216c58;flex:none}.medallion strong{font-size:37px;line-height:1.4}.medallion span{font-size:11px}.result-hero h2{font-size:26px;color:var(--forest);margin:0 0 4px}.result-hero p{color:var(--muted);font-size:15px;margin:0}.result-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:25px 0}.mini-result{border:1px solid #dae4dc;border-radius:15px;background:#fcfdfa;padding:13px}.mini-result strong{display:block;font-size:24px;color:#285a4d}.mini-result span{font-size:12px;color:#6e7871}.section-title{font-size:19px;color:#1f574b;margin:30px 0 13px}.domains{border:1px solid #e0e8e1;border-radius:15px;overflow:hidden}.domain-row{display:grid;grid-template-columns:1.7fr 1fr 2fr;gap:14px;align-items:center;padding:12px 15px;background:#fff;border-bottom:1px solid #ebeee9;font-size:13px}.domain-row:last-child{border:0}.bar{height:9px;background:#e4eee7;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#267962,#d0a957);border-radius:99px}.toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin:25px 0}.tabset{display:flex;gap:8px;flex-wrap:wrap}.tabset .btn{font-size:12px;padding:8px 14px}.tabset .btn.active{background:#e6f0e9;border-color:#7fae99}.review-item{border:1px solid #dce6de;border-radius:16px;background:#fff;padding:19px;margin-bottom:12px;break-inside:avoid-page}.review-header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.review-item h4{margin:12px 0;font-size:17px;color:var(--forest)}.status{font-size:12px;padding:4px 10px;border-radius:99px;background:#e8f2ea;color:#25724f}.status.wrong{background:#fbe9e6;color:var(--red)}.status.empty{background:#f3f0e5;color:#857047}.answer-line{font-size:13px;line-height:1.95;color:#536259}.answer-line b{color:#1d5448}.answer-line .wrong-text{color:#a23d39}.reason{padding:11px 14px;background:#f4f8f3;border-radius:11px;margin-top:10px;color:#405a50;font-size:13px}.meta-line{font-size:12px;color:#79877e;margin-top:10px}.modal-backdrop{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,34,27,.52);z-index:10;padding:20px}.dialog{width:min(96vw,485px);background:white;border-radius:23px;padding:28px;box-shadow:0 20px 60px #0003}.dialog h3{margin:0 0 10px;color:#174c3f}.dialog p{font-size:15px;color:#52675e}.dialog .cta-line{justify-content:flex- <script>
'use strict';
const QUESTION_BANK = [{"domain":"T","standard":"٢","level":"تطبيق","skill":"التحليل الوظيفي للسلوك","question":"في سجل (السابق ـ السلوك ـ النتيجة) كُتب: «طُلبت قراءة فقرة أمام الصف؛ قالت الطالبة لا أستطيع؛ أعفيت من القراءة». ما الحدث السابق المباشر؟","options":["إعفاء الطالبة من القراءة","تكليف الطالبة بالقراءة أمام الصف","قول الطالبة لا أستطيع","شعور المعلمة بالارتياح"],"correct":1,"explanation":"التكليف بالقراءة وقع قبل الاستجابة، ولذلك هو الحدث السابق. القول هو السلوك، والإعفاء هو النتيجة التي قد تسهم في استمراره.","id":1},{"domain":"G","standard":"٤","level":"تطبيق","skill":"القابلية للعكس","question":"قالت طفلة بعد تفكيك بناء من المكعبات: «يمكننا إرجاع القطع نفسها إلى الشكل الأول لأننا لم نفقد أي قطعة». أي قدرة تظهر في تفسيرها؟","options":["التمركز حول الذات","القابلية للعكس في التفكير","الجمهور المتخيل","الإحيائية"],"correct":1,"explanation":"القابلية للعكس هي إدراك إمكان عكس العملية ذهنيًا للوصول إلى الحالة السابقة، وهي من خصائص التفكير المحسوس.","id":2},{"domain":"D","standard":"١٢","level":"تحليل","skill":"مراجعة البيانات لتحسين الأداء","question":"لاحظت الموجهة أن تقرير نجاح البرنامج يذكر عدد اللقاءات فقط، ولا يقيس المهارة المستهدفة. ما الإجراء المهني الأكثر فائدة؟","options":["زيادة الرسوم والصور دون تغيير المؤشرات","إضافة قياس قبلي وبعدي للمهارة ومراجعة النتائج","حذف الهدف من الخطة حتى يتطابق مع التقرير","اعتبار الحضور وحده دليلًا كافيًا على اكتساب المهارة"],"correct":1,"explanation":"عدد الجلسات يدل على التنفيذ؛ ولإثبات التغير ينبغي رصد المهارة المستهدفة بمؤشر مناسب قبل التدخل وبعده.","id":3},{"domain":"G","standard":"٤","level":"تطبيق","skill":"إريكسون: المبادأة","question":"طفلة في الروضة تقترح لعبة جماعية، لكن الكبار يصفون اقتراحاتها مرارًا بأنها «مزعجة». ما الخطر النمائي الذي ينبغي الانتباه له وفق إريكسون؟","options":["الإحساس باليأس المرتبط بالشيخوخة","تراجع المبادأة وازدياد الشعور بالذنب","اختلال التفكير الصوري لدى المراهق","ضعف الاهتمام المهني عند الراشد"],"correct":1,"explanation":"تقييد المبادرات الصغيرة بصورة مهينة قد يغذي الشعور بالذنب بدل تنمية المبادأة في مرحلة الطفولة المبكرة.","id":4},{"domain":"E","standard":"١٦","level":"تحليل","skill":"الحدود المهنية في التواصل الرقمي","question":"تطلب طالبة مشاركة تفاصيل شديدة الحساسية عبر حساب شخصي غير مؤمن للموجهة خارج القنوات المعتمدة. ما الاستجابة الأدق؟","options":["طلب إرسال ملفها الكامل إلى مجموعة غير رسمية","موافقتها على أن الحساب الشخصي سرّي بالضرورة","توجيهها لقناة آمنة ومعتمدة وشرح حدود التواصل والإجراءات المناسبة للحالات العاجلة","إهمال طلبها حتى لا تنشأ مسؤولية مهنية"],"correct":2,"explanation":"تتطلب السرية استخدام قنوات مأمونة ومعتمدة، مع تعريف آلية طلب المساعدة عند الحاجة العاجلة.","id":5},{"domain":"P","standard":"١٠","level":"تحليل","skill":"الفصل بين الانفعال والحكم على الذات","question":"قالت طالبة بعد خطأ في تقديم عرض: «أنا فاشلة ولا أصلح لأي شيء». ما سؤال الاستكشاف الذي يفصل بين ما شعرت به وحكمها العام على نفسها؟","options":["ما الذي يجعلك متأكدة أنك فاشلة في كل شيء؟","هل تعتقدين أن زميلاتك جميعًا أفضل منك؟","عندما وقع الخطأ، هل كان شعورك خجلًا أم إحباطًا أم شيئًا آخر؟","هل ننتقل فورًا إلى الحديث عن درجاتك الأخرى؟"],"correct":2,"explanation":"السؤال يدعو الطالبة إلى تسمية الشعور المرتبط بالموقف قبل مناقشة التقييم العام القاسي للذات.","id":6},{"domain":"T","standard":"٢","level":"تطبيق","skill":"التعلم بالملاحظة","question":"لاحظت طالبة زميلتها تتدرب مرارًا على الإلقاء وتتحسن تدريجيًا، فقررت التجربة لأنها أصبحت تعتقد أن المهارة قابلة للاكتساب. ما المصدر الأوضح لدعم كفاءتها الذاتية؟","options":["العقاب البديل","الاستجابة الشرطية","التشبع المعرفي","الخبرة البديلة من ملاحظة نموذج مشابه"],"correct":3,"explanation":"مشاهدة زميلة مشابهة تنجح بعد الممارسة تمثل خبرة بديلة يمكن أن تعزز توقع الفرد لقدرته على التعلم.","id":7},{"domain":"P","standard":"٨","level":"تحليل","skill":"الالتزام بالتنفيذ","question":"لم تتحسن نتائج برنامج مهاري. تبيّن أن بعض الجلسات أُلغيت، وفنيات التدريب لم تُطبق كما خُطط. ما الخطوة الأولى الأكثر تفسيرًا للنتيجة؟","options":["فحص مدى الالتزام بمكونات البرنامج قبل الحكم على فاعليته","زيادة عدد الاستبانات بعد البرنامج فقط","إلغاء جميع مؤشرات الأثر الأصلية","القول إن البرنامج غير صالح لأي بيئة"],"correct":0,"explanation":"يلزم التمييز بين قصور فاعلية البرنامج وقصور تنفيذه؛ فتقييم مدى الالتزام بالتطبيق يسبق تفسير غياب التحسن.","id":8},{"domain":"D","standard":"١٣","level":"تحليل","skill":"مجتمع التعلم المهني","question":"اجتمعت موجهات لمناقشة تأخر الطالبات، وجربن تدخلين مختلفين، ثم قارَنَّ بيانات الحضور. ما العنصر الذي يجعل الاجتماع أقرب لمجتمع تعلم مهني؟","options":["كون المشاركات من مدارس متعددة فحسب","ربط نقاش مهني بتجريب منظم ومراجعة أدلة على النتائج","عدد الشهادات التي نالتها المشاركات","الاجتماع في قاعة تدريب رسمية"],"correct":1,"explanation":"المجتمع المهني يركز على مشكلة ممارسة حقيقية، وتجريب التحسين ومراجعة الأدلة بصورة دورية.","id":9},{"domain":"T","standard":"٢","level":"تطبيق","skill":"العلاج المتمركز حول الحلول","question":"تقول طالبة إن القلق يرافقها «دائمًا». أي سؤال أقرب إلى فنية البحث عن الاستثناءات في العلاج المتمركز حول الحلول؟","options":["متى كان القلق أقل قليلًا، وما الذي كان مختلفًا في ذلك اليوم؟","ما الجذر اللاواعي لشعورك منذ طفولتك؟","أي مقياس يحدد نوع شخصيتك أولًا؟","هل يمكن أن نلغي القلق تمامًا من الآن؟"],"correct":0,"explanation":"سؤال الاستثناءات يستكشف أوقاتًا لا تظهر فيها المشكلة أو تقل شدتها، بهدف اكتشاف موارد الطالبة وإجراءات قابلة للتكرار.","id":10},{"domain":"P","standard":"٩","level":"تطبيق","skill":"الإرشاد المهني الملائم للعمر","question":"تريد موجهة الابتدائي تعزيز الوعي بالمهن. أي نشاط يراعي المرحلة دون استعجال اختيار تخصص نهائي؟","options":["زيارة افتراضية لمهن متنوعة ومناقشة أدوارها في المجتمع","إلزام كل طالبة بتخصص جامعي يظل ثابتًا","ترتيب الطالبات في مسارات مهنية وفق اختبار واحد","منع تغيير التفضيلات لأنها علامة ضعف قرار"],"correct":0,"explanation":"الهدف في المرحلة الابتدائية هو الاستكشاف والاحترام وفهم تنوع المهن، لا اتخاذ قرار مهني نهائي مبكر.","id":11},{"domain":"D","standard":"١٣","level":"تحليل","skill":"الاستشارة والإشراف","question":"أثناء الإشراف المهني ترغب الموجهة في مناقشة حالة معقدة. أي طريقة تحقق الفائدة وتقلل كشف البيانات؟","options":["عرض المشكلة ومعلوماتها اللازمة دون بيانات تعريفية غير ضرورية","نشر ملف الحالة كاملًا في مجموعة عامة","إرسال تسجيل المقابلة دون فحص الموافقة والصلاحيات","تجنب طلب الاستشارة مهما تعقدت الحالة"],"correct":0,"explanation":"الاستشارة الجيدة توازن بين ما يلزم لفهم الحالة وحماية السرية والامتثال لصلاحيات الاطلاع.","id":12},{"domain":"G","standard":"٤","level":"تطبيق","skill":"إريكسون: الاجتهاد مقابل الشعور بالنقص","question":"طفلة في المرحلة الابتدائية تتجنب المهام لأنها أصبحت تقارن إنجازها بزميلاتها وتشعر بأنها عاجزة. وفق إريكسون، ما الصراع النمائي الأقرب؟","options":["الهوية مقابل اضطراب الدور","الألفة مقابل العزلة","المبادأة مقابل الشعور بالذنب","الاجتهاد مقابل الشعور بالنقص"],"correct":3,"explanation":"في سن المدرسة يبرز بناء الإحساس بالكفاية والإنجاز مقابل الشعور بالنقص، ويُدعَم بالتقدم التدريجي لا بالمقارنات المحبطة.","id":13},{"domain":"E","standard":"١٦","level":"تحليل","skill":"حدود الكفاءة المهنية","question":"طُلب من الموجهة إجراء تشخيص سريري لا تتوافر لديها صلاحية أو تدريب كافٍ له. ما القرار الصحيح؟","options":["إعطاء تشخيص مبدئي باسم اضطراب محتمل إرضاءً للطلب","توضيح حدود الاختصاص وإحالة التقييم لمختص مؤهل ومواصلة الدعم المدرسي المناسب","تفسير أي اختبار نفسي متاح ثم إعلان النتيجة","رفض أي متابعة للطالبة بعد طلب الإحالة"],"correct":1,"explanation":"الاعتراف بحدود الكفاءة وطلب الخدمة المتخصصة يحمي الطالبة، مع الاستمرار فيما يدخل ضمن مهام الموجهة.","id":14},{"domain":"P","standard":"١١","level":"تحليل","skill":"الوساطة في النزاعات","question":"اختلفت زميلتان على توزيع مهمة، ولا توجد تهديدات أو تفاوت قوة أو إيذاء متكرر. أي إجراء يجسد الوساطة المدرسية المناسبة؟","options":["إجبار كل منهما على اعتذار مكتوب قبل الاستماع","إتاحة عرض متوازن للمصالح ثم مساعدتهما على صياغة اتفاق واضح","اتخاذ القرار بدلًا عنهما دون مشاركة","الافتراض أن الطرف الأعلى تحصيلًا هو الأكثر صدقًا"],"correct":1,"explanation":"الوساطة في الخلاف المتكافئ تتطلب حياد إدارة الحوار واستكشاف المصالح والتوصل إلى اتفاق قابل للتنفيذ.","id":15},{"domain":"A","standard":"٧","level":"تحليل","skill":"الاستدلال السببي","question":"انخفضت المخالفات بعد تنفيذ برنامج إرشادي، لكن المدرسة غيّرت في الوقت نفسه نظام متابعة الانضباط. ما الاستنتاج العلمي الأدق؟","options":["البرنامج وحده سبّب التحسن قطعًا","التحسن لا قيمة له ما دام هناك تغيير آخر","ارتبط الانخفاض بمرحلة التدخل، لكن لا يمكن عزوه للبرنامج وحده","لا بد أن النظام الجديد هو العامل الوحيد المؤثر"],"correct":2,"explanation":"مع وجود متغير متزامن يصعب الجزم بالسببية. ينبغي تحليل التغيرات الأخرى والاستفادة من تصميم أقوى وقياسات إضافية.","id":16},{"domain":"A","standard":"٦","level":"تطبيق","skill":"قياس معدل حدوث السلوك","question":"رصدت الموجهة ١٢ مقاطعة خلال ٦٠ دقيقة في يوم، و٨ مقاطعات خلال ٢٠ دقيقة في يوم آخر. ما المؤشر الأعدل لمقارنة تكرار السلوك مع اختلاف مدة الرصد؟","options":["العدد الخام للمقاطعات فقط","تقدير شدة المقاطعة بالانطباع","مدة كل مقاطعة دون حساب تكرارها","معدل المقاطعات لكل وحدة زمنية متماثلة"],"correct":3,"explanation":"اختلاف مدة الرصد يجعل مقارنة التكرار الخام مضللة؛ ويُستخدم المعدل مثل عدد المقاطعات لكل ١٠ دقائق.","id":17},{"domain":"E","standard":"١٤","level":"تحليل","skill":"الإفصاح عن إساءة","question":"أفصحت طفلة عن إيذاء محتمل في المنزل، لكن روايتها غير مكتملة. أي تصرف أولي هو الأنسب؟","options":["توفير الأمان وتوثيق إفادتها بعباراتها وتفعيل مسار البلاغ وفق المعتمد","إجراء تحقيق استجوابي مطوّل معها حتى تصف كل التفاصيل","دعوة الشخص المذكور لمواجهة الطفلة قبل أي إجراء","رفض تدوين الإفادة لأنها غير مكتملة"],"correct":0,"explanation":"الحماية لا تتطلب استكمال تحقيق مدرسي أو مواجهة، ويُتبع مسار البلاغ المعتمد مع توثيق موضوعي وتجنب الأسئلة الإيحائية.","id":18},{"domain":"P","standard":"١٠","level":"تحليل","skill":"استراتيجية مواجهة التوتر","question":"تتوتر طالبة بسبب كثرة الواجبات وقرب المواعيد. أي تدخل يُعد مواجهة متمركزة حول المشكلة مباشرة؟","options":["تجاهل جميع التواريخ لتخفيف الضغط","تقسيم الواجبات ووضع ترتيب زمني واقعي لخطوات الإنجاز","إقناعها أن التوتر غير موجود أصلًا","الاكتفاء بتمارين تهدئة دون معالجة ازدحام المهام"],"correct":1,"explanation":"المواجهة المتمركزة حول المشكلة تتعامل مع مصدر الضغط القابل للتعديل، مثل ترتيب الأعمال وتجزئتها؛ وقد تُضاف تهدئة انفعالية عند الحاجة.","id":19},{"domain":"P","standard":"١٠","level":"تطبيق","skill":"تعميم المهارة الاجتماعية","question":"أتقنت طالبة طلب الدعم في غرفة الإرشاد لكنها نادرًا ما تطلبه من المعلمة داخل الصف. أي خطة تحقق تعميم المهارة؟","options":["تكرار التمثيل في غرفة الإرشاد وحدها إلى ما لا نهاية","إعلان تحقيق الهدف لمجرد نجاحها في الجلسة","استبدال المهارة بأخرى لا علاقة لها بالموقف","تحديد مواقف صفية آمنة للتدريب وتخفيف المساندة ومتابعة الاستخدام"],"correct":3,"explanation":"التعميم انتقال المهارة إلى مواقف وأشخاص طبيعيين؛ لذا يلزم ممارسة مقصودة خارج جلسة التدريب وملاحظة الاستقلال.","id":20},{"domain":"G","standard":"٤","level":"تحليل","skill":"السقالات التعليمية","question":"تنجز طالبة المسائل مع بطاقة تلميحات، ثم بدأت تحل معظمها بدقة دون الاستعانة بها. ما التعديل الأقرب لفيغوتسكي؟","options":["تكثيف التلميحات رغم الاستقلال المتزايد","إيقاف تقديم مهام جديدة نهائيًا","سحب بعض التلميحات تدريجيًا مع فحص استمرار الأداء","إعادة المهمة إلى مستوى أسهل جدًا دون حاجة"],"correct":2,"explanation":"السقالة التعليمية دعم مؤقت يُخفف تدريجيًا عندما ينمو الاستقلال، مع إبقاء المهمة ضمن نطاق تحدٍّ مناسب.","id":21},{"domain":"E","standard":"١٥","level":"تحليل","skill":"تضارب المصالح والحدود","question":"عرضت أسرة هدية مرتفعة القيمة على الموجهة مقابل إعطاء ابنتها أولوية دائمة في الجلسات. ما الرد الأنسب؟","options":["قبول الهدية لأن الأسرة ممتنة، مع تجنب توثيقها","تقديم الطالبة أسبوعًا واحدًا ثم العودة للجدول","استبدال الهدية بخدمة خاصة خارج المدرسة","رفض المنفعة المرتبطة بالمحاباة وتطبيق معايير الخدمة العادلة والضوابط"],"correct":3,"explanation":"ترتبط المسألة بتضارب المصالح وعدالة الوصول؛ لا تُربط الأولوية بمنفعة شخصية أو علاقة خاصة.","id":22},{"domain":"P","standard":"٨","level":"تحليل","skill":"المخرجات والنتائج","question":"نفذت المدرسة ٦ ورش عن إدارة الغضب، وأظهرت الملاحظة انخفاض الشجار بنسبة ٢٥٪. ما التصنيف الأدق لهذين المؤشرين؟","options":["كلاهما نتيجتان سلوكيتان","كلاهما مخرجان للأنشطة فقط","عدد الورش مخرج تنفيذ، وانخفاض الشجار نتيجة مستهدفة","عدد الورش أثر بعيد المدى، والشجار مؤشر موارد"],"correct":2,"explanation":"عدد الورش يصف ما نُفّذ، أما تغيّر الشجار فيصف نتيجة سلوكية تتصل بهدف التدخل.","id":23},{"domain":"E","standard":"١٦","level":"تحليل","skill":"الموافقة الواعية","question":"ترغب الموجهة في استخدام مقابلة إرشادية مسجلة لأغراض تدريبية. ما الشرط الذي يجب فحصه قبل التسجيل؟","options":["أن المشرفة ترغب في مشاهدة التسجيل فحسب","أن الجهاز يلتقط صوتًا عالي الجودة","الموافقات اللازمة وشرح الغرض والاطلاع والتخزين والإتلاف وفق الضوابط","أن الطالبة في مرحلة ابتدائية فلا حاجة لأي توضيح"],"correct":2,"explanation":"يتطلب التسجيل الالتزام بضوابط الموافقة والشرح المناسب للعمر، مع تحديد الغرض والصلاحيات وآلية الحفظ والحذف.","id":24},{"domain":"T","standard":"٣","level":"تحليل","skill":"عمليات المجموعة الإرشادية","question":"في جلسات مجموعة إرشادية بدأت العضوات بالاعتراض على قواعد النقاش والتنافس على أدوار القيادة، قبل أن يستقر التعاون لاحقًا. ما القراءة الأقرب؟","options":["مرحلة إنهاء العلاقة بعد تحقق الأهداف","غياب أي إمكانية لبناء الثقة","ظهور صراعات مرحلة التفاعل أو الصراع ضمن تطور المجموعة","دليل كافٍ على فشل المجموعة والحاجة لإيقافها فورًا"],"correct":2,"explanation":"الاختلاف حول الأدوار والحدود قد يميز مرحلة الصراع في تطور المجموعة، ويتطلب ضبط القواعد وبناء الأمان بدل الحكم المبكر بالفشل.","id":25},{"domain":"T","standard":"٢","level":"تحليل","skill":"التشوهات المعرفية","question":"بعد حصولها على درجة منخفضة في اختبار واحد، قالت طالبة: «سأفشل في كل الاختبارات القادمة». أي تشوّه معرفي هو الأبرز؟","options":["الاستدلال الانفعالي فقط","التجريد الانتقائي فقط","التعميم المفرط انطلاقًا من موقف واحد","الشخصنة وتحميل الذات مسؤولية الآخرين"],"correct":2,"explanation":"انتقلت الطالبة من حادثة واحدة إلى حكم عام على كل الاختبارات، وهو تعميم مفرط. قد تتداخل التشوهات لكن المعطى الأبرز هو التعميم.","id":26},{"domain":"P","standard":"٨","level":"تحليل","skill":"تقدير الاحتياجات","question":"وردت شكاوى متباينة عن ضعف الانضباط، وتريد الموجهة تحديد المشكلة ذات الأولوية قبل بناء برنامج. ما الإجراء الأقوى؟","options":["اختيار الموضوع الأكثر انتشارًا في وسائل التواصل","إقرار البرنامج بناءً على أول شكوى وردت","استنساخ برنامج ناجح في مدرسة أخرى","دمج سجلات السلوك مع آراء الطالبات والمعلمات وتحليل حجم الحاجة"],"correct":3,"explanation":"تقدير الاحتياج يعتمد على معلومات متنوعة وتقاطع الأدلة، ثم تحديد حجم المشكلة والأولوية والفئات المستهدفة.","id":27},{"domain":"P","standard":"١٠","level":"تطبيق","skill":"الدعم الاستباقي للسلوك","question":"تكثر الفوضى عند الانتقال من نشاط جماعي إلى عمل فردي. ما الإجراء الاستباقي الأكثر اتساقًا مع تعديل السوابق؟","options":["وضع إشارة انتقال ثابتة وخطوات مرئية وتدريب الطالبات عليها مسبقًا","الانتظار حتى تحدث الفوضى ثم تسجيل المخالفات فقط","رفع صعوبة المهمة دون تهيئة","التوقف عن الأنشطة الجماعية طوال الفصل"],"correct":0,"explanation":"تعديل المثيرات السابقة مثل الإشارات الروتينية والتهيئة يساعد على الوقاية من المشكلة قبل وقوعها.","id":28},{"domain":"A","standard":"٦","level":"تحليل","skill":"التقويم محكي المرجع","question":"وضعت الموجهة معيارًا: «تطبق الطالبة ثلاث خطوات لتهدئة الذات في موقفين من ثلاثة». ثم قارنت أداء كل طالبة بهذا المعيار لا بزميلاتها. ما نوع التفسير؟","options":["تفسير معياري يعتمد ترتيب الطالبات","تفسير بمقارنة الدرجات المئينية","تفسير محكي المرجع مرتبط بمستوى إتقان محدد","تفسير قائم على متوسط العينة المرجعية"],"correct":2,"explanation":"عندما تُفسّر النتيجة بحسب مستوى أداء محدد مسبقًا، فهذا تقويم محكي المرجع لا معياري المرجع.","id":29},{"domain":"T","standard":"٢","level":"تحليل","skill":"التجارب السلوكية المعرفية","question":"تعتقد طالبة: «إذا سألت المعلمة فسوف يسخر الجميع مني». ما الإجراء الأنسب لاختبار الفكرة بأسلوب معرفي سلوكي؟","options":["مطالبتها بالكف عن التفكير السلبي دون تجربة","الاتفاق على سؤال صغير آمن ثم ملاحظة ردود الأفعال ومقارنة التوقع بالواقع","تفسير حلم الطالبة عن المدرسة","إخبارها مسبقًا أن جميع الزميلات سيشجعنها قطعًا"],"correct":1,"explanation":"التجربة السلوكية تختبر تنبؤًا محددًا بصورة آمنة وتراجع الأدلة الفعلية، بدل طمأنة لا تستند إلى تجربة.","id":30},{"domain":"G","standard":"٤","level":"تحليل","skill":"النظام الخارجي عند برونفنبرنر","question":"تغيّر دوام عمل ولي الأمر إلى ساعات متأخرة، فتأثرت ترتيبات رعاية الطفلة رغم أنها لا تشارك في مكان عمله. ما النظام الأكثر مباشرة لتفسير ذلك؟","options":["النظام الدقيق داخل الصف","النظام الوسيط بين المدرسة والمنزل","النظام الخارجي (الإكسوسيستم)","النظام الحيوي الداخلي فقط"],"correct":2,"explanation":"مكان عمل ولي الأمر لا يضم الطفلة مباشرة، لكنه يؤثر في خبراتها اليومية؛ وهذا مثال للنظام الخارجي.","id":31},{"domain":"E","standard":"١٥","level":"تحليل","skill":"إنصاف تقديم الخدمات","question":"هناك طالبتان تحتاجان موعدًا قريبًا، إحداهما قريبة للموظفة والأخرى تظهر مؤشرات أزمة أشد. ما معيار ترتيب الأولوية؟","options":["درجة الحاجة ومستوى الخطورة وفق معايير مهنية ثابتة","القرب من العاملات بالمدرسة","ترتيب الاسم في كشف الفصل مهما كان الخطر","رغبة الأسرة الأسبق في الاتصال وحدها"],"correct":0,"explanation":"تتحدد الأولوية بحسب الاحتياج والخطر والمعايير العادلة، لا القرابة أو الانطباع الشخصي.","id":32},{"domain":"D","standard":"١٢","level":"تطبيق","skill":"التطوير بمؤشر سلوكي محدد","question":"راجعت الموجهة تسجيلات مقابلاتها فوجدت أنها تنتقل سريعًا للنصيحة بعد كلام الطالبة. ما خطة التحسين الأكثر قابلية للقياس؟","options":["حضور أكبر عدد ممكن من الدورات دون تحديد مهارة","تحسين الشخصية المهنية بصورة عامة","زيادة عدد الملفات الورقية لإظهار الجهد","التدرب على تلخيص حديث الطالبة قبل النصح ورصد تكراره في عشر مقابلات"],"correct":3,"explanation":"التطوير المهني الفعال يربط فجوة محددة بإجراء تدريب ومؤشر قابل للملاحظة في ممارسة فعلية.","id":33},{"domain":"P","standard":"١١","level":"تحليل","skill":"التمييز بين التنمر والخلاف","question":"تعرضت طالبة لإقصاء وسخرية متكررين من مجموعة تتمتع بنفوذ داخل الصف، وهي تخشى الانتقام إذا تحدثت. ما الأولوية المهنية؟","options":["إجراء مواجهة مباشرة بحضور المجموعة لإثبات شجاعتها","اعتبار الأمر مجرد خلاف متكافئ وطلب تنازلات متبادلة","انتظار أسبوعين لجمع حالات إضافية دون أي حماية","توفير الأمان ووقف الأذى والتحقق وفق إجراءات الحماية المعتمدة"],"correct":3,"explanation":"التكرار واختلال القوة والخوف مؤشرات تستلزم الحماية وعدم افتراض تكافؤ الطرفين؛ مع توثيق وتحقيق مناسبين.","id":34},{"domain":"D","standard":"١٢","level":"تحليل","skill":"تقويم أثر التدريب","question":"بعد ورشة عن مهارات الإصغاء، ارتفع رضا المشاركات، لكن الموجهة تريد دليلًا أقوى على انتقال التدريب إلى الممارسة. ماذا تفعل؟","options":["تحسب عدد صفحات الحقيبة التدريبية","تكتفي بنسبة الرضا عن المدربة","ترصد ممارسة مهارات الإصغاء في مقابلات لاحقة باستخدام أداة ثابتة","تزيد مدة الورشة دون تحديد فجوة"],"correct":2,"explanation":"رضا المتدربات مؤشر انطباع، أما رصد الأداء المهني بعد التدريب فيقيس انتقال التعلم إلى الممارسة.","id":35},{"domain":"P","standard":"١١","level":"تحليل","skill":"الشراكة الأسرية غير الاتهامية","question":"تراجع التزام طالبة بالواجبات بعد انتقال الأسرة إلى منزل جديد. ما افتتاح التواصل مع الأسرة الأكثر دعمًا للتعاون؟","options":["تقصيركم واضح ويجب ألا يتكرر.","لن نناقش الأسباب؛ يكفي توقيع تعهد.","نحتاج نقلها إلى فصل آخر فورًا قبل سماعكم.","لاحظنا تغيرًا في إنجازها بعد الانتقال، ونود فهم ما يساعدها ووضع خطة معًا."],"correct":3,"explanation":"التواصل القائم على الملاحظة والفضول المهني والشراكة يتيح فهم عوامل التعثر بعيدًا عن اللوم المسبق.","id":36},{"domain":"T","standard":"٢","level":"تحليل","skill":"الإرشاد المتمركز حول المسترشد","question":"تقول طالبة: «أضحك أمام زميلاتي، لكنني أشعر بالوحدة». أي رد يعكس الفهم التعاطفي دون تفسير أو طمأنة متعجلة؟","options":["قد يكون الحل أن تقضي وقتًا أطول مع زميلاتك.","يبدو أنك تُظهرين المرح، بينما تعيشين شعورًا بالوحدة لا يلاحظه الآخرون.","ربما تخافين تكوين علاقات لأن ثقتك بنفسك ضعيفة.","ليس من المنطقي أن تشعري بالوحدة وأنت تضحكين معهن."],"correct":1,"explanation":"الانعكاس التعاطفي يصف التناقض الذي عرضته الطالبة ومعناه الانفعالي دون تشخيص سببه أو تقديم نصيحة مبكرة.","id":37},{"domain":"G","standard":"٤","level":"تحليل","skill":"اشتمال الفئات","question":"في سلة ٧ تفاحات و٣ برتقالات، سُئلت طفلة: «أيهما أكثر: التفاح أم الفاكهة؟» فقالت: «التفاح». ما المهارة المعرفية التي لم تتضح بعد؟","options":["فهم اشتمال الفئة العامة على الفئة الفرعية","إدراك ثبات السائل في الأوعية المختلفة","تذكر سلسلة الكلمات دون خطأ","استخدام فروض مجردة لاختبار النتائج"],"correct":0,"explanation":"الفاكهة فئة تشمل التفاح والبرتقال معًا؛ المقارنة بين الكل وأحد أجزائه تختبر اشتمال الفئات.","id":38},{"domain":"A","standard":"٦","level":"تحليل","skill":"تحيز اختيار العينة","question":"استطلعت الموجهة رضا الطالبات عن برنامج مدرسي بإرسال الاستبانة إلى المتطوعات للمشاركة في البرنامج فقط. ما القيد الأهم عند تعميم النتائج؟","options":["أن الاستبانات لا تقيس آراء الطالبات مطلقًا","احتمال تحيز الاختيار لأن المتطوعات قد لا يمثلن الجميع","أن استخدام إجابات رقمية يمنع التحليل","أن كل إجابة صادقة تعني صلاحية تعميم النتائج"],"correct":1,"explanation":"المتطوعات قد يختلفن عن غير المشاركات في الدافعية أو الرضا؛ ومن ثم لا يصح تعميم النتائج دون تقدير تحيز العينة.","id":39},{"domain":"T","standard":"٢","level":"تحليل","skill":"التعزيز والعقاب","question":"كانت طالبة تتأخر عمدًا عن الاصطفاف. بعد تطبيق إجراء يلزمها بوقت إضافي من التدريب عند التأخر، انخفض التأخر. ما التصنيف الأقرب لنتيجة الإجراء؟","options":["تعزيز إيجابي؛ لأن وقت التدريب أُضيف","عقاب إيجابي؛ لأن مثيرًا أُضيف فانخفض السلوك","تعزيز سلبي؛ لأن الصباح صار أقل جاذبية","عقاب سلبي؛ لأن التأخر انخفض"],"correct":1,"explanation":"إضافة نتيجة غير مرغوبة عقب التأخر أدت إلى انخفاضه؛ لذا تُصنف عقابًا إيجابيًا في التحليل السلوكي. التصنيف يعتمد على التغيير في السلوك.","id":40},{"domain":"T","standard":"٢","level":"تحليل","skill":"المقابلة التحفيزية","question":"قالت طالبة: «أريد تنظيم نومي، لكنني أخشى أن أفقد وقت الحديث مع صديقاتي». ما الرد الأوفق بروح المقابلة التحفيزية؟","options":["لا بد أن تختاري بين النوم والصداقة دون نقاش.","أنت غير مقتنعة بالتغيير، لذلك لا فائدة من الحديث.","هناك جانب فيك يريد الراحة، وجانب يقلقه الابتعاد عن صديقاتك.","سأضع لك جدولًا ملزمًا قبل أن توضحي ما تريدين."],"correct":2,"explanation":"عكس التردد أو الازدواجية يساعد الطالبة على استكشاف دوافعها الذاتية للتغيير دون مواجهة أو إقناع قسري.","id":41},{"domain":"G","standard":"٤","level":"تحليل","skill":"كولبرغ والحكم الأخلاقي","question":"تقول طالبة: «لن أغش لأن زميلاتي سيعتبرنني غير أمينة، وأريد أن أحافظ على ثقتهم». أي مستوى للحكم الأخلاقي يظهر أكثر؟","options":["مستوى ما قبل التقليدي المعتمد حصريًا على العقوبة","مرحلة المبادئ الأخلاقية الكونية المستقلة","مرحلة المنفعة المباشرة دون اعتبار للآخرين","المستوى التقليدي المرتبط بقبول الجماعة وتوقعاتها"],"correct":3,"explanation":"تستند الطالبة إلى رضا الجماعة والمحافظة على العلاقات والثقة، وهو نمط من التبرير الأخلاقي التقليدي.","id":42},{"domain":"P","standard":"٣","level":"تحليل","skill":"تهيئة المجموعة الإرشادية","question":"قبل جلسات جماعية لتنمية المهارات الاجتماعية، تبيّن أن إحدى المرشحات تمر بأزمة حادة وتحتاج متابعة فردية عاجلة. ما القرار الأدق؟","options":["إدراجها في المجموعة وحدها بوصفه تدخلًا كافيًا","استبعادها نهائيًا من أي خدمة مدرسية","تقدير حاجتها الفردية العاجلة وتوفير التدخل المناسب قبل أو بالتوازي مع قرار المجموعة","تجاهل المعلومة لأنها أُعلنت بعد تكوين القائمة"],"correct":2,"explanation":"اختيار أعضاء المجموعة يستلزم فحص الملاءمة والاستعداد والأمان؛ وقد تكون بعض الحالات بحاجة إلى تدخل فردي أو إحالة متخصصة.","id":43},{"domain":"A","standard":"٧","level":"تحليل","skill":"اختيار مقياس النزعة المركزية","question":"عدد أيام الغياب لخمس طالبات: ٠، ١، ١، ٢، ٢١. تريد الموجهة قيمة تمثل الغياب المعتاد دون تأثر كبير بالقيمة المتطرفة. ما الأنسب؟","options":["المتوسط الحسابي لأنّه الأقل تأثرًا بالقيم المتطرفة","الوسيط؛ لأنه أقل تأثرًا بالقيمة المتطرفة","المدى؛ لأنه يعبر عن القيمة المعتادة","الانحراف المعياري؛ لأنه يحدد القيمة الأكثر تكرارًا"],"correct":1,"explanation":"الوسيط بعد الترتيب يساوي يومًا واحدًا، وهو أقل حساسية لوجود القيمة الكبيرة ٢١ مقارنة بالمتوسط.","id":44},{"domain":"T","standard":"٢","level":"تطبيق","skill":"تشكيل السلوك","question":"لا تستطيع طالبة إلقاء كلمة أمام الصف. كافأت الموجهة أولًا وقوفها أمام زميلتين، ثم حديثها لجماعة صغيرة، ثم أمام الصف كاملًا. ما الفنية الأبرز؟","options":["التشكيل بالتعزيز المتدرج لاقترابات من الأداء المستهدف","الإشباع بمثير واحد حتى يفقد قيمته","التلقين اللفظي دون تعزيز","تجاهل السلوك النهائي بعد ظهوره"],"correct":0,"explanation":"التشكيل يعني تعزيز اقترابات متتابعة من الاستجابة النهائية، مع رفع معيار الأداء تدريجيًا.","id":45},{"domain":"E","standard":"١٤","level":"تحليل","skill":"الاستجابة لخطر فوري","question":"أخبرت طالبة الموجهة أنها تفكر بإيذاء نفسها اليوم ولديها خطة محددة، وطلبت ألا يعلم أحد. ما الأولوية المهنية الفورية؟","options":["تأجيل أي إجراء إلى موعد المقابلة الأسبوعية","الاكتفاء بتعهد شفهي ثم إعادتها وحدها إلى الصف","عدم تركها دون حماية وتفعيل إجراءات السلامة والإبلاغ والإحالة العاجلة وفق النظام","وعدها بسرية مطلقة حفاظًا على العلاقة"],"correct":2,"explanation":"وجود خطر آني وخطة محددة يستدعي حماية فورية وتفعيل بروتوكولات المدرسة والجهات المختصة؛ السرية لها استثناءات للحماية.","id":46},{"domain":"T","standard":"٢","level":"تحليل","skill":"العلاج بالواقع","question":"في جلسة وفق العلاج بالواقع، حدّدت الطالبة هدفها، ثم سُئلت: «هل ما تفعلينه يقربك منه؟» وقالت لا. ما الخطوة التالية الأقرب إلى عملية التخطيط؟","options":["استحضار الصراعات اللاواعية القديمة","إجراء اختبار إسقاطي لتحديد الرموز","إلقاء اللوم على البيئة المدرسية","الاتفاق على خطوة بسيطة واقعية تقع ضمن سيطرتها ومتابعتها"],"correct":3,"explanation":"بعد التقييم الذاتي في العلاج بالواقع تنتقل العملية إلى تخطيط فعل محدد قابل للتنفيذ يقع في نطاق مسؤولية الطالبة.","id":47},{"domain":"P","standard":"١٠","level":"تحليل","skill":"عكس الشعور مقابل إعادة المحتوى","question":"تقول طالبة: «أعددت للنشاط أيامًا ثم استُبعدت منه دون توضيح». أي استجابة تعكس الشعور أكثر من مجرد تكرار الوقائع؟","options":["تشعرين بخيبة وربما بالظلم بعد هذا الجهد.","إذن أمضيت أيامًا في إعداد النشاط ثم استُبعدت.","كم يومًا استغرق إعدادك للنشاط؟","هل تريدين تقديم شكوى مكتوبة الآن؟"],"correct":0,"explanation":"عكس المشاعر يلتقط الانفعال المستدل عليه من التجربة، بينما إعادة المحتوى تركز على الوقائع.","id":48},{"domain":"T","standard":"٢","level":"فهم","skill":"مدخل أدلر","question":"يركز برنامج إرشادي على شعور الطالبة بالانتماء وتعاونها مع زميلاتها وتحمل المسؤولية داخل الجماعة. ما المفهوم الأقرب عند أدلر؟","options":["التداعي الحر","المصلحة أو الاهتمام الاجتماعي","الاشتراط الكلاسيكي","الذكاء المتبلور"],"correct":1,"explanation":"الاهتمام الاجتماعي عند أدلر يتصل بالانتماء والتعاون والإسهام الإيجابي في المجتمع.","id":49},{"domain":"A","standard":"٧","level":"تحليل","skill":"النقاط المئوية والنسبة النسبية","question":"انخفضت نسبة الغياب غير المبرر من ٣٠٪ إلى ١٨٪. ما مقدار الانخفاض بالنقاط المئوية؟","options":["١٢ نقطة مئوية","١٨ نقطة مئوية","٤٠ نقطة مئوية","٦٠ نقطة مئوية"],"correct":0,"explanation":"الفارق بالنقاط المئوية = ٣٠ − ١٨ = ١٢ نقطة. أما الانخفاض النسبي فهو ٤٠٪ من المستوى الأصلي، وهو مفهوم آخر.","id":50},{"domain":"E","standard":"١٦","level":"تطبيق","skill":"شرح السرية في الإرشاد الجمعي","question":"قبل أول لقاء لمجموعة إرشادية، ما التوضيح الأكثر مهنية بشأن السرية؟","options":["نتفق على حماية خصوصية ما يُقال، ونشرح حدود السرية والحالات التي تستلزم حماية أو إبلاغًا.","كل ما تقوله أي عضوة سيُنشر للمعلمات للتقييم.","يمكنني ضمان التزام كل عضوة بالسرية مهما حدث.","لا داعي لذكر السرية لأن المجموعة صارت متجانسة."],"correct":0,"explanation":"ينبغي بيان القواعد والحدود منذ البداية؛ ولا يمكن تقديم ضمان مطلق لسلوك أعضاء المجموعة خارج الجلسات.","id":51},{"domain":"E","standard":"١٦","level":"تحليل","skill":"حماية معلومات الطالبات","question":"فُقد جهاز يحتوي على ملفات إرشادية غير محمية بكلمة مرور. ما الاستجابة المهنية الأنسب؟","options":["الانتظار حتى يسأل أحد عن الملفات","حذف أسماء الملفات من الفهرس الورقي فقط","إنكار وجود ملفات لتجنب المساءلة","الإبلاغ فورًا وفق إجراءات حماية البيانات وتقييم المخاطر واتخاذ إجراءات الحد من الضرر"],"correct":3,"explanation":"فقدان ملفات حساسة يستلزم تفعيل إجراءات حادثة الخصوصية بحسب النظام، لا الإخفاء أو التأخير.","id":52},{"domain":"P","standard":"٨","level":"تحليل","skill":"فهم رفض الذهاب إلى المدرسة","question":"تشتكي طالبة صباحًا من ألم البطن أيام العروض الشفهية، ويخف الألم عندما تتأكد أن العرض أُلغي. ما الفرضية الأولى التي ينبغي التحقق منها؟","options":["أن الغياب دليل كافٍ على كسل الطالبة","أن الألم مختلق قطعًا ولا يحتاج انتباهًا","أن تجنب موقف الإلقاء المثير للقلق قد يحافظ على الغياب، مع فحص العوامل الأخرى","أن التواصل مع الأسرة وحده سيحل المشكلة دون تقييم"],"correct":2,"explanation":"العلاقة الزمنية بين الموقف المقلق وزوال العرض ترجح فرضية التجنب أو الهروب، لكن لا تغني عن تقييم شامل بما فيه الأسباب الصحية.","id":53},{"domain":"D","standard":"١٣","level":"تحليل","skill":"تكييف الممارسة المستندة للدليل","question":"تريد المدرسة تطبيق برنامج أثبت فاعلية في سياق آخر، لكن الفئة العمرية والموارد تختلفان. ما التصرف الأفضل؟","options":["تطبيق جميع المكونات حرفيًا بغض النظر عن ملاءمتها","ترك كل المكونات الأصلية وإبقاء العنوان فقط","رفض استخدام أي برنامج ثبت نجاحه خارج المدرسة","تحديد العناصر الجوهرية وتكييف الوسائل ثم متابعة النتائج"],"correct":3,"explanation":"تحافظ الممارسة المستندة للدليل على المكونات الفاعلة الأساسية مع تكييف طريقة التنفيذ للسياق وتقييم الأثر.","id":54},{"domain":"A","standard":"٦","level":"تحليل","skill":"ثبات اتفاق المقدّرين","question":"شاهدت موجهتان تسجيل موقف واحد، وصنّفت كل منهما السلوك وفق التعريف الإجرائي نفسه. تريد المدرسة معرفة مدى اتفاق حكمهما. أي دليل يخصها؟","options":["ثبات اتفاق المقدّرين أو الملاحظين","الصدق التنبؤي بعد سنوات","ثبات إعادة الاختبار عبر شهور","الاتساق الداخلي بين فقرات المقياس"],"correct":0,"explanation":"المطلوب مقارنة أحكام ملاحظتين على السلوك نفسه؛ وهذا يختبر اتفاق المقدّرين، لا تغير الدرجة عبر الزمن.","id":55},{"domain":"G","standard":"٥","level":"تحليل","skill":"ملاءمة الدعم للفروق الفردية","question":"تريد الموجهة تعليم مهارة الاعتذار لطالبات تتفاوت قدراتهن اللغوية، مع بقاء الهدف واحدًا. أي تصميم هو الأكثر ملاءمة؟","options":["إتاحة تمثيل الموقف أو بطاقة مصورة أو صياغة لفظية، ثم قياس المهارة نفسها","الاكتفاء بنص كتابي واحد طويل لأنه يحقق المساواة","إعفاء من تقل طلاقتها اللغوية من الهدف بالكامل","تقييم سرعة القراءة بدل جودة الاعتذار"],"correct":0,"explanation":"تنويع طرائق الوصول والاستجابة يزيل عائق اللغة غير المرتبط بالهدف، مع الحفاظ على معيار المهارة المستهدفة.","id":56},{"domain":"P","standard":"٨","level":"تطبيق","skill":"الهدف القابل للقياس","question":"أي هدف لبرنامج تنظيم الوقت يجعل تقويم النجاح بعد ستة أسابيع أكثر دقة؟","options":["أن تحب الطالبات إدارة الوقت أكثر من السابق","أن تنجز ٧٠٪ من المشاركات خططًا أسبوعية ويلتزمن بها أربعة أسابيع من ستة","أن تصبحن مسؤولات في جميع جوانب حياتهن","أن تتحسن الانطباعات العامة عن البرنامج"],"correct":1,"explanation":"الهدف الجيد يحدد أداءً قابلاً للرصد ونسبة وفترة متابعة، بدل صفة عامة أو انطباع غير محدد.","id":57},{"domain":"P","standard":"٩","level":"تحليل","skill":"الميول والقيم المهنية","question":"طالبة تحب تصميم البرامج، لكنها تصر على وظيفة تتيح لها خدمة ذوي الإعاقة حتى إن قلّ دخلها. كيف تصنف «خدمة ذوي الإعاقة» في قرارها؟","options":["قدرة عقلية مقننة","مهارة تقنية مكتسبة","قيمة مهنية توجه المفاضلة بين البدائل","رتبة مئينية في اختبار الميول"],"correct":2,"explanation":"القيمة المهنية تعبّر عما تعتبره الطالبة مهمًا في العمل، وقد تختلف عن الميل إلى نشاط بعينه أو القدرة على أدائه.","id":58},{"domain":"G","standard":"٥","level":"تطبيق","skill":"التفاوت الطبيعي في النمو","question":"بلغت طالبتان العمر نفسه، لكن إحداهما أكثر استعدادًا لتنظيم عملها باستقلال. ما القرار التربوي الأكثر دقة؟","options":["توقع تطابق الكفايات لمجرد تطابق العمر","اعتبار الفارق دليلًا مؤكدًا على اضطراب لدى إحداهما","تقديم الواجب نفسه بالطريقة نفسها دون ملاحظة","تقويم مستوى الاستعداد الفعلي وتدرّج الدعم وفق الحاجة"],"correct":3,"explanation":"النمو لا يتقدم بالسرعة نفسها عند الجميع أو في جميع المجالات؛ لذلك يتحدد الدعم بالملاحظة والاحتياج لا بالعمر وحده.","id":59},{"domain":"E","standard":"١٦","level":"تطبيق","skill":"الخصوصية والحد الأدنى من البيانات","question":"طلبت معلمة دعمًا لطالبة يزداد غيابها، وتحتاج تعديل بعض الواجبات. ما المعلومات الأنسب مشاركتها؟","options":["جميع تفاصيل المقابلات الأسرية لأن المعلمة شريكة تربوية","التوصيات العملية اللازمة لدور المعلمة دون كشف تفاصيل لا تتطلبها المهمة","نسخة غير مختصرة من سجل الإرشاد","نتائج اختبارات أخت الطالبة للمقارنة"],"correct":1,"explanation":"يقتصر تبادل المعلومات على ما يلزم للغرض ومع الأشخاص المخولين، مع إبقاء بقية التفاصيل سرية.","id":60},{"domain":"G","standard":"٤","level":"تحليل","skill":"العمليات الصورية","question":"في نشاط يناقش فرضية «لو اختفت الإشارات المرورية من المدينة»، بدأت طالبة تستنتج آثارًا متسلسلة دون تجربة مباشرة. أي نمط معرفي يظهر؟","options":["الاعتماد المطلق على المحسوس الماثل","الاحتفاظ بالكمية فقط","التفكير الافتراضي الاستنباطي","الاستجابة المنعكسة غير المتعلمة"],"correct":2,"explanation":"الاستدلال انطلاقًا من فرضية افتراضية وتحليل نتائجها يعكس التفكير الصوري أو الافتراضي الاستنباطي.","id":61},{"domain":"G","standard":"٤","level":"تحليل","skill":"إريكسون: الهوية","question":"تغيّر مراهقة اهتماماتها وأدوارها الاجتماعية، وتجرّب خيارات دراسية مختلفة لتفهم ما يناسب قيمها. أي مهمة نمائية تتصدر؟","options":["تكوين الهوية مقابل اضطراب الدور","الاستقلالية مقابل الشك في الطفولة المبكرة","الثقة الأساسية مقابل عدم الثقة","التكامل مقابل اليأس"],"correct":0,"explanation":"استكشاف الأدوار والالتزامات والقيم من مهام بناء الهوية في المراهقة وفق إريكسون.","id":62},{"domain":"D","standard":"١٣","level":"تحليل","skill":"مراجعة علمية نقدية","question":"وجدت الموجهة دراسة تدّعي فاعلية تدخل، لكن العينة صغيرة جدًا ولم تُقارن بمجموعة أخرى. كيف تستفيد منها؟","options":["تتعامل مع نتائجها بوصفها أولية وتراجع جودة الدليل قبل التعميم","تعتبرها حكمًا قاطعًا يصلح لجميع المراحل","ترفضها لمجرد أنها منشورة حديثًا","تقتبس النتيجة فقط وتحذف حدود الدراسة"],"correct":0,"explanation":"فحص التصميم وحجم العينة والحدود جزء من الاستفادة النقدية من الأدلة قبل نقل التدخل إلى المدرسة.","id":63},{"domain":"G","standard":"٤","level":"تحليل","skill":"الاحتفاظ عند بياجيه","question":"رتبت المعلمة عشرة مكعبات في صفين؛ أحدهما متباعد والآخر متقارب. قالت طفلة: «الصف الطويل فيه أكثر رغم تساوي عدد المكعبات». أي مفهوم لم يثبت لديها بعد؟","options":["التسلسل الهرمي للمهن","الاستقلال الأخلاقي الكامل","التفكير الافتراضي","الاحتفاظ بالعدد رغم تغير التوزيع المكاني"],"correct":3,"explanation":"الاحتفاظ بالعدد يعني إدراك أن عدد الوحدات ثابت رغم اختلاف المسافات أو شكل العرض، ويرتبط بنمو العمليات المحسوسة.","id":64},{"domain":"G","standard":"٤","level":"تحليل","skill":"النظام الوسيط عند برونفنبرنر","question":"تحسّن التكيف الدراسي لطفلة بعد اتفاق الأسرة والمعلمة على أسلوب موحد للتواصل والمتابعة. أي مستوى بيئي يفسر التفاعل بين هذين المحيطين المباشرين؟","options":["النظام الزمني","النظام الوسيط (الميزوسيستم)","النظام الثقافي الأوسع فقط","النظام الخارجي المرتبط بمكان عمل الوالد"],"correct":1,"explanation":"العلاقة بين البيت والمدرسة بوصفهما نظامين مباشرين للطفلة تقع في النظام الوسيط عند برونفنبرنر.","id":65},{"domain":"T","standard":"٢","level":"تحليل","skill":"الإطفاء والانفجار الإطفائي","question":"اعتادت طالبة جذب الانتباه بطرق متكررة. بعد وقف الانتباه الذي كان يعزز ذلك السلوك، ارتفع مؤقتًا في الأيام الأولى ثم بدأ يتراجع. ما التفسير الأنسب للارتفاع الأولي؟","options":["نجاح التعزيز الإيجابي الجديد","انتقال تلقائي إلى تعزيز اجتماعي ثابت","طفرة الإطفاء الأولية المحتملة","اكتساب استجابة شرطية مضادة"],"correct":2,"explanation":"قد يرتفع السلوك أو يتنوع مؤقتًا عند توقف التعزيز الذي حافظ عليه، ثم ينخفض إذا نُفّذ التدخل بصورة مناسبة وآمنة.","id":66},{"domain":"T","standard":"٢","level":"تحليل","skill":"العلاج العقلاني الانفعالي","question":"قالت طالبة: «إذا انتقدتني المعلمة فهذا يثبت أنني بلا قيمة». عند تطبيق نموذج إيليس، ما العنصر الأكثر ملاءمة للمناقشة أولًا؟","options":["الربط الحتمي بين النقد وقيمة الذات","عدد مرات توجيه النقد خلال الفصل","تسلسل جلوس الطالبة في الصف","مقدار استحسان الزميلات للمعلمة"],"correct":0,"explanation":"الاعتقاد الجامد الذي يربط النقد بالقيمة الذاتية هو ما يفسر الانفعال، ولذلك يناقشه المرشد لبناء تفسير أكثر مرونة.","id":67},{"domain":"P","standard":"٩","level":"تحليل","skill":"هولاند: النمط الفني","question":"تستمتع طالبة بابتكار رسوم وقصص وحلول أصلية، وتكره غالبًا المهام ذات التعليمات شديدة التقييد. أي نمط مهني لهولاند يبدو أقرب لميولها؟","options":["التقليدي (Conventional)","الفني (Artistic)","الواقعي (Realistic)","البحثي (Investigative)"],"correct":1,"explanation":"النمط الفني يميل إلى التعبير والابتكار والأصالة، مع أهمية عدم اختزال قرار مهني نهائي في مؤشر ميل واحد.","id":68},{"domain":"T","standard":"٢","level":"تحليل","skill":"التعميم في الإشراط الكلاسيكي","question":"تعرضت طالبة لموقف مخيف أثناء اختبار في غرفة معينة، ثم أصبحت تشعر بالتوتر في غرف اختبارات مشابهة، وإن لم يقع فيها الموقف. ما العملية الأقرب؟","options":["التمييز بين المثيرات","التعزيز المتقطع","التعلم الإجرائي بالمكافأة","تعميم الاستجابة الشرطية على مثيرات مشابهة"],"correct":3,"explanation":"انتقل التوتر من المثير المرتبط بالتجربة إلى مثيرات شبيهة، وهو تعميم للمثير في الإشراط الكلاسيكي.","id":69},{"domain":"E","standard":"١٤","level":"تحليل","skill":"فصل الوقائع عن الاستنتاج","question":"اكتشفت الموجهة أن تقريرًا مهنيًا نُقل منه استنتاج غير مؤكد باعتباره حقيقة. ما أول إجراء تصحيحي مناسب؟","options":["الإبقاء على التقرير حتى لا تتضرر سمعة فريق العمل","حذف التقرير من كل مكان دون توثيق التصحيح","إعلان أسماء جميع المعنيات لتفسير الخطأ","تصحيح موثق وفق النظام وإشعار المخولين الذين بُني قرارهم على الاستنتاج الخاطئ"],"correct":3,"explanation":"التصحيح المهني يجب أن يحفظ سلامة السجل، ويعالج أثر المعلومة على القرارات دون نشر بيانات غير لازمة.","id":70},{"domain":"E","standard":"١٤","level":"تحليل","skill":"التوثيق الموضوعي","question":"أخبرت طالبة الموجهة: «قالت لي زميلتي إنها ستضربني». لم تُتحقق الواقعة بعد. أي عبارة تصلح للتوثيق؟","options":["ثبت أن الزميلة معتدية وخطرة في جميع الأحوال.","أفادت الطالبة بأن زميلتها قالت كذا، ويجري التحقق مع اتخاذ ما يلزم للحماية.","تتعمد الطالبة المبالغة في نقل الكلام.","حُسمت الواقعة لأن مصدرها الطالبة نفسها."],"correct":1,"explanation":"يسجل المصدر والعبارة والوقائع والإجراءات مع الفصل بين الادعاء والاستنتاج، دون إهمال تدابير الحماية اللازمة.","id":71},{"domain":"A","standard":"٦","level":"تحليل","skill":"الصدق التنبؤي","question":"صُمم مقياس للاستعداد المهني، ثم دُرست علاقته بأداء الطالبات الفعلي في برنامج مهني لاحق. أي دليل صدق يُفحص أساسًا؟","options":["صدق المحتوى عبر تقدير الخبراء فقط","ثبات النصفين داخل التطبيق","الاتساق الداخلي لفقرات الاستبيان","الصدق التنبؤي القائم على محك لاحق"],"correct":3,"explanation":"عندما تربط درجات مقياس حالي بنتيجة const LETTERS=['أ','ب','ج','د'];
const domainNames={T:'الأسس والنظريات والمناهج',G:'خصائص النمو ومطالبه',A:'أدوات جمع المعلومات',P:'البرامج الإرشادية',D:'التطوير المهني',E:'المسؤوليات الأخلاقية والمهنية'};
const STORAGE='guidance_licence_practice_v2_75';
const total=QUESTION_BANK.length;
const app=document.getElementById('app');
let model={started:false,finished:false,at:0,answers:Array(total).fill(null),flagged:Array(total).fill(false),visited:Array(total).fill(false),elapsed:0,timeForEach:Array(total).fill(0),filter:'all',lastTick:Date.now()};
let timerId=null;
const ar = x => String(x).replace(/[0-9]/g, n=>'٠١٢٣٤٥٦٧٨٩'[+n]);
const safe = x => String(x).replace(/[&<>"']/g, a => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));
const fmtTime = sec => ar(Math.floor(sec/3600)).padStart(1,'٠')+' س '+ar(Math.floor(sec%3600/60)).padStart(2,'٠')+' د '+ar(sec%60).padStart(2,'٠')+' ث';
const score = () => QUESTION_BANK.reduce((s,q,i)=>s+(model.answers[i]===q.correct?1:0),0);
const answered = () => model.answers.filter(a=>a!==null).length;
function save(){try{localStorage.setItem(STORAGE,JSON.stringify({...model,lastTick:Date.now()}));}catch(e){}}
function load(){try{let raw=JSON.parse(localStorage.getItem(STORAGE));if(!raw || !Array.isArray(raw.answers) || raw.answers.length!==total)return false; model={...model,...raw,lastTick:Date.now()};return true;}catch(e){return false;}}
function reset(){model={started:false,finished:false,at:0,answers:Array(total).fill(null),flagged:Array(total).fill(false),visited:Array(total).fill(false),elapsed:0,timeForEach:Array(total).fill(0),filter:'all',lastTick:Date.now()};save();stopTimer();render();window.scrollTo(0,0);}
function startExam(){model.started=true;model.finished=false;model.lastTick=Date.now();model.visited[model.at]=true;save();startTimer();render();window.scrollTo(0,0);}
function startTimer(){stopTimer();model.lastTick=Date.now();timerId=setInterval(()=>{if(!model.started||model.finished)return;let now=Date.now(), delta=Math.min(3,Math.max(0,(now-model.lastTick)/1000));model.lastTick=now;model.elapsed+=delta;model.timeForEach[model.at]+=delta;let el=document.getElementById('time-clock');if(el)el.textContent=fmtTime(Math.floor(model.elapsed));if(Math.floor(model.elapsed)%8===0)save();},1000)}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null;}}
function render(){if(!model.started)renderWelcome();else if(model.finished)renderReport();else renderQuestion();}
function renderWelcome(){let canResume=!!(model.answers.some(x=>x!==null)||model.elapsed>0);app.innerHTML=`<section class="welcome panel"><div class="eyebrow">تدريب متقدم • تطبيق وتحليل</div><h2>اختبار جديد من ٧٥ سؤالًا<br>بنمط اختيار الإجابة الأنسب</h2><p>المحاولة الثانية مبنية على تحليل تقريرك السابق. تركز بعمق أكبر على <b>خصائص النمو والإرشاد النفسي</b>، مع مواقف في بقية المجالات ومشتتات أكثر تقاربًا.</p><div class="lead-stat"><div class="stat-tile"><strong>٧٥</strong><span>سؤالًا جديدًا</span></div><div class="stat-tile"><strong>٦</strong><span>مجالات</span></div><div class="stat-tile"><strong>٤</strong><span>اختيارات لكل سؤال</span></div></div><div class="note">لن تظهر الحلول أثناء الإجابة. يمكنكِ التنقل ووضع علامة للمراجعة، ثم يظهر تقرير بالنتيجة والوقت وتفصيل كل سؤال وسبب الإجابة. لا يُفترض هذا الاختبار مماثلًا رسميًا من حيث عدد الأسئلة أو الزمن أو الأوزان.</div><div class="cta-line"><button class="btn primary" id="start">ابدئي الاختبار</button>${canResume?'<button class="btn secondary" id="resume">استكمال المحاولة المحفوظة</button>':''}</div></section>`;
 document.getElementById('start').onclick=()=>{if(canResume){confirmDialog('بدء محاولة جديدة','ستُمسح الإجابات الحالية لهذه النسخة التدريبية.',()=>{reset();startExam();});}else startExam();};
 let resume=document.getElementById('resume');if(resume)resume.onclick=startExam;}
function goto(idx){if(idx<0||idx>=total)return;model.at=idx;model.visited[idx]=true;save();renderQuestion();window.scrollTo({top:0,behavior:'smooth'});}
function choose(idx){model.answers[model.at]=idx;save();renderQuestion();}
function toggleFlag(){model.flagged[model.at]=!model.flagged[model.at];save();renderQuestion();}
function renderQuestion(){let q=QUESTION_BANK[model.at], n=model.at+1, done=answered();let options=q.options.map((o,i)=>`<button role="radio" aria-checked="${model.answers[model.at]===i}" class="option ${model.answers[model.at]===i?'selected':''}" data-choice="${i}"><span class="optletter">${LETTERS[i]}</span><span class="choice-text">${safe(o)}</span><span class="dot" aria-hidden="true"></span></button>`).join('');let map=QUESTION_BANK.map((qq,i)=>`<button aria-label="السؤال ${ar(i+1)}" title="السؤال ${ar(i+1)}" class="qdot ${model.answers[i]!==null?'done':''} ${i===model.at?'active':''} ${model.flagged[i]?'flagged':''}" data-q="${i}">${ar(i+1)}</button>`).join('');
app.innerHTML=`<div class="exam-layout"><section class="question-panel panel"><div class="question-top"><div class="minor">السؤال <b>${ar(n)}</b> من <b>${ar(total)}</b></div><div class="timer" title="الوقت المنقضي، وليس حدًا رسميًا">وقت المحاولة: <b id="time-clock">${fmtTime(Math.floor(model.elapsed))}</b></div></div><div class="progress-track" role="progressbar" aria-valuenow="${done}" aria-valuemin="0" aria-valuemax="${total}"><div class="progress-value" style="width:${Math.round(done/total*100)}%"></div></div><h2 class="question-text">${safe(q.question)}</h2><div class="option-list" role="radiogroup" aria-label="اختيارات الإجابة">${options}</div><div class="q-footer"><div class="nav-buttons"><button class="btn primary" id="next">${n===total?'مراجعة وتسليم':'التالي ←'}</button><button class="btn secondary" id="prev" ${n===1?'disabled':''}>السابق →</button></div><div class="other-buttons"><button class="btn flagbtn ${model.flagged[model.at]?'active':''}" id="flag">${model.flagged[model.at]?'★ أزيلِي علامة المراجعة':'☆ علّمي للمراجعة'}</button><button class="btn gold" id="finish">مراجعة وتسليم</button></div></div><div class="minor" style="margin-top:15px">يمكنكِ الرجوع وتعديل اختياركِ حتى التسليم النهائي. لن تُكشف الحلول الآن.</div></section><aside class="sidebar panel"><h3>خريطة الأسئلة</h3><p class="small-muted">اضغطي رقمًا للانتقال إليه</p><div class="question-grid">${map}</div><div class="legend"><span><i class="key"></i>مجاب</span><span><i class="key empty"></i>غير مجاب</span><span><i class="key flag"></i>للمراجعة ★</span></div><div class="side-foot">أُجيب عن <b>${ar(done)}</b> من <b>${ar(total)}</b><div style="margin-top:5px">تحتاج مراجعة: <b>${ar(model.flagged.filter(Boolean).length)}</b></div></div></aside></div>`;
app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(+b.dataset.choice));app.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>goto(+b.dataset.q));document.getElementById('prev').onclick=()=>goto(model.at-1);document.getElementById('next').onclick=()=>model.at===total-1?showSubmit():goto(model.at+1);document.getElementById('flag').onclick=toggleFlag;document.getElementById('finish').onclick=showSubmit;
}
function confirmDialog(title,message,ok){let old=document.getElementById('overlay');if(old)old.remove();let wrap=document.createElement('div');wrap.className='modal-backdrop';wrap.id='overlay';wrap.setAttribute('role','dialog');wrap.setAttribute('aria-modal','true');wrap.innerHTML=`<div class="dialog"><h3>${safe(title)}</h3><p>${safe(message)}</p><div class="cta-line"><button class="btn primary" id="accept-dialog">تأكيد</button><button class="btn" id="cancel-dialog">العودة</button></div></div>`;document.body.appendChild(wrap);wrap.querySelector('#cancel-dialog').onclick=()=>wrap.remove();wrap.querySelector('#accept-dialog').onclick=()=>{wrap.remove();ok()};}
function showSubmit(){const missing=total-answered(),flags=model.flagged.filter(Boolean).length;let msg=`أجبتِ عن ${ar(answered())} من ${ar(total)}. `+(missing?`يوجد ${ar(missing)} سؤالًا بلا إجابة، وستُحسب دون درجة. `:'')+(flags?`ويوجد ${ar(flags)} سؤالًا معلمًا للمراجعة. `:'')+'هل تريدين إنهاء المحاولة وإظهار النتيجة والحلول الآن؟';confirmDialog('تسليم المحاولة',msg,()=>{model.finished=true;model.filter='all';save();stopTimer();renderReport();window.scrollTo(0,0);});}
function domainStats(){return Object.entries(domainNames).map(([k,label])=>{let a=QUESTION_BANK.map((q,i)=>({...q,index:i})).filter(q=>q.domain===k);let c=a.filter(q=>model.answers[q.index]===q.correct).length;return {key:k,label,total:a.length,correct:c,pct:Math.round(100*c/a.length)};});}
function perQ(i){let q=QUESTION_BANK[i],given=model.answers[i],good=given===q.correct;let resultLabel=given===null?'دون إجابة':good?'إجابة صحيحة':'تحتاج مراجعة';let resultClass=given===null?'empty':good?'':'wrong';return `<div class="review-item" data-review="${good?'right':'wrong'}"><div class="review-header"><span class="minor">السؤال ${ar(i+1)} • ${safe(domainNames[q.domain])}</span><span class="status ${resultClass}">${resultLabel}</span></div><h4>${safe(q.question)}</h4><div class="answer-line"><b>الإجابة الصحيحة:</b> ${LETTERS[q.correct]} — ${safe(q.options[q.correct])}</div><div class="answer-line"><b>إجابتكِ:</b> <span class="${!good?'wrong-text':''}">${given===null?'لم تختاري إجابة':LETTERS[given]+' — '+safe(q.options[given])}</span></div><div class="reason"><b>التفسير:</b> ${safe(q.explanation)}</div><div class="meta-line">المعيار ${ar(q.standard)} • ${safe(q.skill)} • مستوى السؤال: ${safe(q.level)}</div></div>`}
function renderReport(){let sc=score(),wrong=total-sc,missing=total-answered(),percent=Math.round(sc*100/total),weak=domainStats().filter(x=>x.pct<100).sort((a,b)=>a.pct-b.pct);let strong=percent>=90?'أداء تدريبي متقدم':percent>=75?'أداء جيد مع نقاط قابلة للتحسين':'فرصة ممتازة لتحديد أولويات المراجعة';let message=weak.length?`أولوية المراجعة بحسب هذه المحاولة: ${weak.slice(0,2).map(x=>x.label).join('، ')}.`:'أُجيبت جميع أسئلة المجالات إجابة صحيحة في هذه المحاولة.';let rows=domainStats().map(d=>`<div class="domain-row"><b>${safe(d.label)}</b><span>${ar(d.correct)} / ${ar(d.total)} • ${ar(d.pct)}٪</span><span class="bar" aria-label="${ar(d.pct)} بالمئة"><i style="width:${d.pct}%"></i></span></div>`).join('');let toReview=QUESTION_BANK.map((q,i)=>i).filter(i=>model.filter==='all'||(model.filter==='wrong'&&model.answers[i]!==QUESTION_BANK[i].correct)||(model.filter==='flagged'&&model.flagged[i]));
app.innerHTML=`<section class="results panel"><div class="print-only"><h2>تقرير محاكاة رخصة الإرشاد الطلابي — المحاولة الثانية</h2><p>تقرير تدريبي غير رسمي، صادر محليًا من ملف الاختبار.</p></div><div class="result-hero"><div class="medallion"><strong>${ar(percent)}٪</strong><span>نسبة الإجابات الصحيحة</span></div><div style="flex:1"><span class="eyebrow">اكتملت المحاولة</span><h2>${safe(strong)}</h2><p>${ar(sc)} إجابة صحيحة من ${ar(total)}. ${safe(message)}</p><p style="margin-top:9px">نتيجة تدريبية خام؛ لا تعني اجتيازًا رسميًا أو درجة معيارية في اختبار الترخيص.</p></div></div><div class="result-grid"><div class="mini-result"><strong>${ar(sc)}</strong><span>إجابة صحيحة</span></div><div class="mini-result"><strong>${ar(wrong-missing)}</strong><span>إجابة غير صحيحة</span></div><div class="mini-result"><strong>${ar(missing)}</strong><span>سؤال بلا إجابة</span></div><div class="mini-result"><strong>${fmtTime(Math.floor(model.elapsed))}</strong><span>الوقت المنقضي</span></div></div><h3 class="section-title">الأداء حسب المجال</h3><div class="domains">${rows}</div><div class="note" style="margin-top:18px">ركّزي في المراجعة على <b>سبب الإجابة</b> لا على حرف الاختيار. هذا الاختبار من إعداد تدريبي مستقل، وتوزيع مجالاته ومستوياته لا يمثل مواصفات رسمية معتمدة.</div><div class="toolbar screen-only"><div class="tabset"><button class="btn ${model.filter==='all'?'active':''}" data-filter="all">جميع الأسئلة (${ar(total)})</button><button class="btn ${model.filter==='wrong'?'active':''}" data-filter="wrong">الأخطاء والمتروك (${ar(wrong)})</button><button class="btn ${model.filter==='flagged'?'active':''}" data-filter="flagged">المعلّمة للمراجعة (${ar(model.flagged.filter(Boolean).length)})</button></div><div class="nav-buttons"><button id="print" class="btn primary">طباعة التقرير / حفظ PDF</button><button id="retry" class="btn">إعادة المحاولة</button></div></div><h3 class="section-title">مراجعة الإجابات وأسبابها</h3><div id="review-list">${toReview.length?toReview.map(perQ).join(''):'<div class="note">لا توجد أسئلة ضمن هذه التصفية.</div>'}</div><div class="print-only"><p>نهاية التقرير التدريبي.</p></div></section>`;
app.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{model.filter=b.dataset.filter;save();renderReport();});document.getElementById('retry').onclick=()=>confirmDialog('إعادة المحاولة','سيتم مسح نتيجة هذه المحاولة والإجابات السابقة وإعادة فتح الأسئلة نفسها. احفظي تقريرك أولًا إذا احتجتِ إليه.',reset);document.getElementById('print').onclick=()=>{let old=model.filter;model.filter='all';renderReport();window.print();model.filter=old;renderReport();};}
let previous=load();render();if(model.started&&!model.finished)startTimer();
</script>
</body></html>
